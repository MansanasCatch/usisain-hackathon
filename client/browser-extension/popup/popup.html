<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UsisAIn — Trust & Fraud Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <!-- ── Header ── -->
  <header class="ext-header">
    <div class="header-top">
      <div class="header-icon">🛡️</div>
      <div class="header-text">
        <div class="header-title">UsisAIn</div>
        <div class="header-subtitle">Trust & Fraud Detector</div>
      </div>
    </div>
  </header>

  <!-- ── LLM and Model Selectors (Uniform with Dashboard) ── -->
  <div class="selectors-bar">
    <!-- Custom LLM Provider Selector -->
    <div class="model-selector-wrapper" id="llm-selector-container">
      <button class="model-selector-trigger" id="llm-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="llm-provider-badge"></span>
        <span class="model-name-text" id="active-llm-name">Ollama (Local)</span>
        <span class="chevron">▼</span>
      </button>
      <div class="model-selector-dropdown" id="llm-dropdown">
        <div class="model-selector-list" id="llm-list">
          <div class="model-item active-model" data-value="ollama">
            <div class="model-item-info">
              <div class="model-item-header">
                <span class="model-item-name">Ollama (Local)</span>
                <span class="model-item-status-badge status-active">Active</span>
              </div>
              <div class="model-item-details">
                <span class="model-item-size">Local Host</span>
              </div>
            </div>
            <span class="model-item-check">✓</span>
          </div>
          <div class="model-item" data-value="gemini">
            <div class="model-item-info">
              <div class="model-item-header">
                <span class="model-item-name">Gemini (Cloud)</span>
                <span class="model-item-status-badge status-available">Cloud API</span>
              </div>
              <div class="model-item-details">
                <span class="model-item-size">Google Online</span>
              </div>
            </div>
            <span class="model-item-check" style="display: none;">✓</span>
          </div>
          <div class="model-item" data-value="grok">
            <div class="model-item-info">
              <div class="model-item-header">
                <span class="model-item-name">Grok (xAI)</span>
                <span class="model-item-status-badge status-available">Cloud API</span>
              </div>
              <div class="model-item-details">
                <span class="model-item-size">xAI Online</span>
              </div>
            </div>
            <span class="model-item-check" style="display: none;">✓</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Active Model Selector -->
    <div class="model-selector-wrapper" id="ollama-selector-container">
      <button class="model-selector-trigger" id="model-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="model-status-indicator"></span>
        <span class="model-name-text" id="active-model-name">Loading...</span>
        <span class="chevron">▼</span>
      </button>
      <div class="model-selector-dropdown" id="model-dropdown">
        <!-- Switching overlay loader -->
        <div class="model-switch-overlay" id="model-switch-overlay">
          <div class="spinner"></div>
          <div class="loading-text">Switching active model...</div>
        </div>
        <div class="model-selector-search-box">
          <input type="text" id="model-search" placeholder="Search models..." autocomplete="off">
        </div>
        <div class="model-selector-list" id="model-list">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <!-- Server IP Display Badge -->
  <div style="padding: 0 20px; margin: 10px 0 14px;">
    <div class="server-ip-badge" id="server-ip-container">
      <span class="server-ip-dot"></span>
      <span>Server IP: <strong id="server-ip-value">Loading...</strong></span>
    </div>
  </div>

  <!-- ── Language Selector & OCR Toggle ── -->
  <div class="controls-section">
    <div class="control-row">
      <span class="control-label">Preferred Language</span>
      <div class="styled-select">
        <select id="language-select">
          <option value="english" selected>English</option>
        </select>
      </div>
    </div>
    <div class="control-row popup-control-row-toggle">
      <span class="control-label">Narrate with voice (TTS)</span>
      <input type="checkbox" id="tts-toggle" class="popup-checkbox">
    </div>
    <!-- Voice selector (shown when TTS is enabled) -->
    <div id="tts-voice-row" class="control-row popup-voice-row">
      <span class="control-label popup-sub-label">Voice</span>
      <div class="styled-select">
        <select id="tts-voice-select"></select>
      </div>
    </div>
    <div class="control-row popup-control-row-toggle">
      <span class="control-label">Use Tesseract-OCR</span>
      <input type="checkbox" id="ocr-toggle" class="popup-checkbox" checked>
    </div>
  </div>

  <!-- ── Navigation Buttons ── -->
  <div class="nav-buttons">
    <button class="nav-btn primary" id="btn-analyze">
      <span class="btn-icon">🔍</span>
      Analyze Manually
    </button>
    <button class="nav-btn" id="btn-dashboard">
      <span class="btn-icon">📊</span>
      Dashboard
    </button>
  </div>

  <!-- ── Status & History ── -->
  <div id="status"></div>
  <ul id="history"></ul>

  <script src="popup.js"></script>
</body>

</html>
