<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UsisAIn — Trust & Fraud Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <!-- ── Header ── -->
  <header class="ext-header">
    <div class="header-top">
      <div class="header-icon">🛡️</div>
      <div class="header-text">
        <div class="header-title">UsisAIn</div>
        <div class="header-subtitle">Trust & Fraud Detector</div>
      </div>
      <div class="provider-badge" id="provider-badge">
        <span class="dot"></span>
        <span id="provider-name">Loading…</span>
      </div>
    </div>
  </header>

  <!-- ── Language Selector ── -->
  <div class="controls-section">
    <div class="control-row">
      <span class="control-label">Preferred Language</span>
      <div class="styled-select">
        <select id="language-select">
          <option value="english" selected>English</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ── Navigation Buttons ── -->
  <div class="nav-buttons">
    <button class="nav-btn primary" id="btn-analyze">
      <span class="btn-icon">🔍</span>
      Analyze Manually
    </button>
    <button class="nav-btn" id="btn-dashboard">
      <span class="btn-icon">📊</span>
      Dashboard
    </button>
  </div>

  <!-- ── Status & History ── -->
  <div id="status"></div>
  <ul id="history"></ul>

  <script src="popup.js"></script>
</body>

</html>
