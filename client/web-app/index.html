<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UsisAIn — Analyze</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <header>
    <h1>UsisAIn</h1>
    <nav>
      <a href="/app/" class="active">Analyze</a>
      <a href="/app/dashboard/">Dashboard</a>
    </nav>
  </header>

  <main>
    <div class="card" style="margin-bottom: 20px;">
      <form id="analyze-form">
        <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;">
          <select id="content-mode">
            <option value="text">Text / claim</option>
            <option value="image">Image</option>
            <option value="video">Video</option>
            <option value="post">Post (caption + image)</option>
          </select>
          <select id="language">
            <option value="english" selected>English</option>
            <option value="taglish">Taglish</option>
            <option value="tagalog">Tagalog</option>
            <option value="cebuano">Cebuano</option>
            <option value="bisaya">Bisaya</option>
            <option value="ilocano">Ilocano</option>
          </select>
          <select id="llm-provider">
            <option value="gemini" selected>Gemini (cloud)</option>
            <option value="ollama">Ollama (local)</option>
          </select>
          <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); user-select:none; cursor:pointer;">
            <input type="checkbox" id="tts-toggle" style="width:auto; cursor:pointer;">
            Narrate with voice (TTS)
          </label>
        </div>

        <textarea id="text-input" placeholder="Paste the claim, message, or caption to check..." rows="4" style="width:100%; margin-bottom:10px;"></textarea>
        <input id="file-input" type="file" accept="image/*,video/*" style="display:none; margin-bottom:10px;">

        <button type="submit" id="submit-btn">Analyze</button>
      </form>
    </div>

    <div id="results" class="card" style="display:none;">
      <div id="results-header" style="font-weight:600; margin-bottom:8px;">Analyzing…</div>
      <div id="step-1" class="step-row"></div>
      <div id="step-2" class="step-row"></div>
      <div id="step-3" class="step-row"></div>
      <div id="step-4" class="step-row"></div>
      <div id="step-5" class="step-row"></div>
    </div>
  </main>

  <script src="shared/sse_client.js"></script>
  <script src="shared/tts_player.js"></script>
  <script src="analyze.js"></script>
</body>
</html>
